<!-- Header -->
<ngds-input-header
  #inputHeader
  [label]="label"
  [subLabel]="subLabel"
  [control]="control"
></ngds-input-header>

<!-- Input wrapper -->
<div
  #dropdownElement
  class="input-group border rounded-3 position-relative"
  [ngClass]="getWrapperClasses()"
>

  <!-- Prepended content -->
  <ng-content
    #inputPrepend
    select="[ngdsInputPrepend]"
  ></ng-content>

  <!-- Input -->
  <div
    class="form-input border-0 d-flex w-100 overflow-hidden"
    style="min-height: 2.25rem"
    [ngClass]="getInputClasses()"
    [attr.data-bs-display]="!dynamicPositioning ? 'static' : null"
  >
    <!-- Align multiselect when input is toggled/untoggled -->
    <div
      class="w-100"
      [ngClass]="{'d-flex': isInputHidden()}"
      #inputElement
    >
      <!-- Multiselect display items -->
      <div
        *ngIf="multiselect && control?.value?.length"
        class="mx-1 mt-1 d-flex justify-content-left row w-100"
        #typeaheadInput
      >
        <ngds-multiselect-item
          class="col-auto p-0 mb-1 me-1"
          *ngFor="let item of control?.value"
          [option]="getOptionByValue(item)"
          (remove)="removeValue($event)"
          [disabled]="isDisabled"
          role="menuitem"
        >
        </ngds-multiselect-item>
      </div>
      <!-- Text input for typeahead -->
        <input
          #typeaheadInput
          (focus)="dropdownFocus()"
          autocomplete="off"
          aria-haspopup="menu"
          [attr.aria-expanded]="isOpen"
          [attr.aria-describedby]="describedBy"
          [attr.aria-invalid]="ariaInvalid"
          [attr.aria-required]="ariaRequired"
          [attr.id]="control?.id"
          [(ngModel)]="currentDisplay"
          [placeholder]="placeholder && !isInputHidden() ? placeholder : ''"
          (ngModelChange)="typeaheadChange($event)"
          [disabled]="isDisabled"
          class="rounded border-0 form-select position-relative"
          [ngClass]="getInputClasses()"
          [ngClass]="{'is-invalid': isInvalid, 'w-100': !isInputHidden(), 'closed-multiselect-input': isInputHidden()}"
        >
      <!-- Dropdown Items-->
      <ul
        #dropdownMenu
        role="menu"
        class="dropdown-menu"
        [ngClass]="getDropdownClasses()"
        style="max-height: 250px; overflow-y: auto; min-width: 400px"
      >
        <!-- Rebuild the whole list on every repopulate (showList toggled in
             rebuildList): the bootstrap-managed <ul> leaves stale/duplicate
             rows under incremental *ngFor diffing, so it is fully re-stamped. -->
        <ng-container *ngIf="showList">
          <!-- No results -->
          <div
            *ngIf="!refinedListItems || refinedListItems.length === 0"
            class="py-1 px-3 text-muted"
          >
            {{ noResultsText }}
          </div>
          <!-- Items rendered directly in the list (matches picklist). -->
          <button
            *ngFor="let match of refinedListItems; trackBy: trackByValue"
            class="dropdown-item"
            [class.focused]="checkFocusIndex(match)"
            (mouseenter)="setFocusIndex(refinedListItems.indexOf(match))"
            (click)="selected(match)"
            [class.active]="match?.value === control?.value"
            [attr.aria-current]="match?.value === control?.value"
            type="button"
            role="menuitem"
            [value]="match?.value || match"
            [disabled]="match?.disabled"
          >
            <!-- Custom item template if provided, else default highlighted html -->
            <ng-container
              *ngIf="selectionListTemplate; else defaultItem"
              [ngTemplateOutlet]="selectionListTemplate"
              [ngTemplateOutletContext]="{ data: match }"
            ></ng-container>
            <ng-template #defaultItem>
              <div [innerHtml]="match?.innerHtml"></div>
            </ng-template>
          </button>
        </ng-container>
      </ul>
    </div>

    <div class="d-flex justify-content-right">
      <!-- Select all button -->
      <button
        *ngIf="multiselect && selectAllButton"
        type="button"
        aria-label="select all"
        class="btn btn-inline border-0 focus-highlight"
        [disabled]="isDisabled"
        (click)="selectAll()"
      ><i class="bi bi-list-check"></i></button>

      <!-- Clear control button -->
      <button
        *ngIf="showResetButton()"
        type="button"
        aria-label="reset input"
        class="btn btn-inline border-0 focus-highlight"
        [disabled]="isDisabled"
        (click)="resetClicked()"
      ><i class="bi bi-x-lg"></i></button>

      <!-- Appended content -->
      <ng-content
        #inputAppend
        select="[ngdsInputAppend]"
      ></ng-content>
    </div>
  </div>

  <!-- Overlay content -->
  <ngds-input-overlay
    #inputOverlay
    [loading]="isLoading"
  ></ngds-input-overlay>
</div>

<!-- Footer -->
<ngds-input-footer [errorId]="errorId"
  #inputFooter
  [control]="control"
  [invalid]="isInvalid && !hideInvalidState"
  [config]="invalidConfig"
></ngds-input-footer>
